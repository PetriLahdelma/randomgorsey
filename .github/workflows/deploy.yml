name: Main Branch Validation

on:
  push:
    branches: [main]

jobs:
  main-branch-checks:
    name: Main Branch Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies with legacy peer deps for React 19 compatibility..."
          npm ci --legacy-peer-deps

      - name: TypeScript Check
        run: npm run ts:check:types

      - name: Studio Storybook Contract Type Check
        run: npx --no-install tsc --project tsconfig.stories.json

      - name: ESLint
        run: npm run lint

      - name: CSS lint
        run: npx --no-install stylelint "src/**/*.css"

      - name: Run Tests
        run: npm test

      - name: Security Audit
        run: |
          echo "🔒 Pre-deployment security check..."
          # Block releases with high or critical production advisories.
          npm audit --audit-level=high --omit=dev

          # Ensure no secrets are exposed
          echo "🔍 Checking for exposed secrets..."
          if grep -r "service_kua7hu3\|template_wr7fpxc\|-BdVWUzt4g0H07ZtM\|hGd8c8A065HXhuzGGQ7Yu" src/ --exclude-dir=node_modules; then
            echo "❌ Hardcoded secrets found in source code!"
            exit 1
          fi
          echo "✅ Security check completed"

      - name: Build Application
        run: npm run build

      - name: Install Playwright CLI and browser
        run: |
          npm install --global @playwright/cli@0.1.23
          playwright-cli install-browser chromium --with-deps

      - name: Browser regression checks
        run: npm run test:browser

      - name: Build Storybook
        run: npm run build-storybook -- --output-dir .omx/ci/storybook

      - name: Storybook accessibility and interaction checks
        run: node scripts/storybook-check.mjs
