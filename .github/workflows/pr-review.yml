name: PR Quality Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Check
        run: npm run ts:check:types

      - name: Studio Storybook Contract Type Check
        run: npx --no-install tsc --project tsconfig.stories.json

      - name: ESLint
        run: npm run lint

      - name: CSS lint
        run: npx --no-install stylelint "src/**/*.css"

      - name: Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Install Playwright CLI and browser
        run: |
          npm install --global @playwright/cli@0.1.23
          playwright-cli install-browser chromium --with-deps

      - name: Browser regression checks
        run: npm run test:browser

      - name: Build Storybook
        run: npm run build-storybook -- --output-dir .omx/ci/storybook

      - name: Storybook accessibility and interaction checks
        run: node scripts/storybook-check.mjs

      - name: Bundle summary
        if: always()
        run: |
          if [ -d .next/static/chunks ]; then
            {
              echo "## Largest JavaScript chunks"
              find .next/static/chunks -type f -name '*.js' -print0 \
                | xargs -0 du -h \
                | sort -hr \
                | head -10
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install production dependencies
        run: npm ci --legacy-peer-deps --omit=dev

      - name: Check production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
